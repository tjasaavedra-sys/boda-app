<!-- Archivo: index.html -->
<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Bloqueo para motores de búsqueda (Evita que Google/Bing indexen la web) -->
  <meta name="robots" content="noindex, nofollow">
  
  <title>Mi Boda Soñada - Planificador PWA</title>
  
  <!-- Configuración PWA e iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e11d48">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Boda">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3656/3656836.png">

  <!-- Tailwind CSS v3 via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wedding: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full flex flex-col md:flex-row text-slate-800 antialiased selection:bg-wedding-100 selection:text-wedding-900">

  <!-- BARRA NAVEGACIÓN LATERAL (DESKTOP / MAC / PC) -->
  <aside class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 z-30 bg-white border-r border-slate-200 shadow-sm">
    <div class="flex flex-col flex-grow pt-5 pb-4 overflow-y-auto">
      <div class="flex items-center flex-shrink-0 px-6 gap-3">
        <div class="p-2 bg-wedding-100 text-wedding-600 rounded-xl">
          <i data-lucide="heart-handshake" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">Mi Boda</h1>
          <p class="text-xs text-slate-500 font-medium">Planificador Personal</p>
        </div>
      </div>

      <nav class="mt-8 flex-1 px-3 space-y-1" id="desktop-menu">
        <!-- Generado dinámicamente desde app.js -->
      </nav>

      <div class="p-4 mx-3 mb-2 bg-wedding-50 border border-wedding-100 rounded-2xl text-center">
        <div class="flex justify-center mb-1 text-wedding-600">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <p class="text-xs font-semibold text-wedding-900">Estado PWA Local</p>
        <p class="text-[11px] text-wedding-700 mt-0.5">Sincronizado e instalable</p>
      </div>
    </div>
  </aside>

  <!-- NAVEGACIÓN MÓVIL SUPERIOR (HEADER) -->
  <header class="md:hidden sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="p-1.5 bg-wedding-100 text-wedding-600 rounded-lg">
        <i data-lucide="heart-handshake" class="w-5 h-5"></i>
      </div>
      <span class="font-bold text-slate-900 text-base" id="mobile-title">Resumen</span>
    </div>
    <button id="pwa-install-btn" class="hidden text-xs bg-wedding-600 text-white font-medium px-3 py-1.5 rounded-full shadow-sm hover:bg-wedding-700 transition-colors">
      Instalar App
    </button>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 md:pl-64 flex flex-col min-h-screen pb-20 md:pb-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 pt-6 w-full flex-1">
      
      <!-- CONTENEDOR DINÁMICO DE MÓDULOS -->
      <div id="app-content">
        <!-- Se renderizará el módulo activo con JS -->
      </div>

    </div>
  </main>

  <!-- BARRA NAVEGACIÓN INFERIOR (MÓVIL / IPHONE / ANDROID) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 py-1 flex justify-around items-center" id="mobile-menu">
    <!-- Generado dinámicamente desde app.js -->
  </nav>

  <!-- SISTEMA DE NOTIFICACIONES TOAST -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- MODAL GENERAL / FORMULARIOS -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden transition-opacity"></div>
  <div id="modal-container" class="fixed inset-x-4 top-1/2 -translate-y-1/2 md:inset-auto md:left-1/2 md:top-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-full md:max-w-lg bg-white rounded-3xl shadow-2xl border border-slate-100 z-50 hidden flex-col max-h-[90vh] overflow-hidden">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h3 class="text-lg font-bold text-slate-900" id="modal-title">Título Modal</h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div class="p-6 overflow-y-auto flex-1" id="modal-body">
      <!-- Contenido dinámico del formulario -->
    </div>
  </div>

  <!-- Cargar lógica principal -->
  <script src="app.js"></script>
</body>
</html>
